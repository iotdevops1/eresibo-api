name: eresibo-prod

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

    networks:
      - eresibo_network

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "127.0.0.1:8085:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - eresibo_network

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    ports:
      - "3309:3306"

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - eresibo_network

volumes:
  mysql_data:

networks:
  eresibo_network:
    driver: bridge
