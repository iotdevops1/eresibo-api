version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eresibo_api_app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - eresibo_network

  nginx:
    image: nginx:alpine

    container_name: eresibo_api_nginx

    ports:
      - "8085:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - eresibo_network

  mysql:
    image: mysql:8.4

    container_name: eresibo_mysql

    restart: unless-stopped

    ports:
      - "3309:3306"

    environment:
      MYSQL_DATABASE: eresibo_db
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: eresibo_db
      MYSQL_PASSWORD: admin

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - eresibo_network

volumes:

  mysql_data:

networks:

  eresibo_network: